<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPI Help — Agentic Framework Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background: #eef0f5; height: 100vh; display: flex; justify-content: center; align-items: center; }

  .app { width: 560px; height: 780px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.14);
         display: flex; flex-direction: column; overflow: hidden; }

  .header { background: #14161f; color: #fff; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; }
  .header .title { font-size: 15px; font-weight: 700; }
  .header .subtitle { font-size: 11px; color: #9aa0ac; margin-top: 2px; }
  .header .reset { background: #2a2d3a; border: none; color: #fff; font-size: 11px; padding: 6px 12px;
                    border-radius: 14px; cursor: pointer; }
  .header .reset:hover { background: #4338ca; }

  .chat-log { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; background: #f7f8fb; }

  .row { display: flex; flex-direction: column; margin-bottom: 14px; }
  .row.user { align-items: flex-end; }
  .row.bot { align-items: flex-start; }

  .bubble { max-width: 80%; padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .bubble.user { background: #4338ca; color: #fff; border-bottom-right-radius: 4px; }
  .bubble.bot { background: #fff; color: #1c1f26; border: 1px solid #e5e7f0; border-bottom-left-radius: 4px; }

  .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 2px 9px; border-radius: 10px; font-weight: 700; }
  .badge.domain { background: #eef0ff; color: #4338ca; }
  .badge.fast { background: #e3f9e9; color: #0f7b3f; }
  .badge.slow { background: #fef3e2; color: #b06a06; }
  .badge.blocked { background: #fde8e8; color: #c0272d; }

  .trace-toggle { font-size: 10.5px; color: #8b8fa3; cursor: pointer; margin-top: 4px; text-decoration: underline; }
  .trace-panel { display: none; background: #0f1117; color: #8ee6a1; font-size: 10px; font-family: "SF Mono", monospace;
                 padding: 10px; border-radius: 8px; white-space: pre-wrap; margin-top: 6px; max-width: 80%;
                 max-height: 200px; overflow-y: auto; }
  .trace-panel.show { display: block; }

  .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #eceef3; }
  .qr-btn { background: #f2f3fa; border: 1px solid #e0e2f0; color: #14161f; font-size: 12.5px; padding: 8px 14px;
            border-radius: 18px; cursor: pointer; }
  .qr-btn:hover { background: #4338ca; color: #fff; border-color: #4338ca; }
  .qr-btn.candidate { background: #14161f; color: #fff; }
  .qr-btn.candidate:hover { background: #4338ca; }

  .typing { font-size: 12.5px; color: #9aa0ac; padding: 6px 15px; }
  .mandate-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 14px; }
.mandate-card { background: #fff; border: 1.5px solid #e5e7f0; border-radius: 12px; padding: 12px 14px;
                cursor: pointer; transition: all 0.15s; }
.mandate-card:hover { border-color: #4338ca; box-shadow: 0 2px 10px rgba(67,56,202,0.12); }
.mandate-card .merchant { font-size: 13.5px; font-weight: 700; color: #14161f; margin-bottom: 4px; }
.mandate-card .amount { font-size: 16px; font-weight: 800; color: #4338ca; margin-bottom: 4px; }
.mandate-card .status { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px;
                          background: #e3f9e9; color: #0f7b3f; font-weight: 700; }
.mandate-card .select-hint { font-size: 11px; color: #9aa0ac; margin-top: 6px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
  <div>
    <div class="title">UPI Help — Agentic Framework Demo</div>
    <div class="subtitle" id="sessionLabel"></div>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="reset" onclick="resetSession()">New session</button>
    <button class="reset" style="background:#7a2020;" onclick="resetDatabase()">Reset database</button>
  </div>
</div>

  <div class="chat-log" id="chatLog"></div>

  <div class="quick-replies" id="quickReplies"></div>
  <input type="file" id="screenshotInput" accept="image/*" style="display:none" onchange="uploadScreenshot(this.files[0])">
</div>

<script>
let sessionId = newSessionId();
document.getElementById("sessionLabel").textContent = "session: " + sessionId;

const DEFAULT_REPLIES = [
  { label: "Cancel Spotify mandate", value: "cancel my Spotify mandate" },
  { label: "Cancel Netflix mandate", value: "cancel my Netflix mandate" },
  { label: "Why did my Swiggy payment fail?", value: "why did my Swiggy payment fail" },
  { label: "File a complaint about this", value: "file a complaint about this" },
  { label: "UPI limit", value: "UPI limit" },
  { label: "What is UPI Lite?", value: "what is UPI Lite" },
  { label: "How do I register for UPI?", value: "how do I register for UPI" },
  { label: "Check my dispute status", value: "check my dispute status" },
  { label: "📷 Attach a screenshot", value: "__upload__" }
  ];

function newSessionId() {
  return "web-" + Math.random().toString(36).slice(2, 10);
}

function resetSession() {
  sessionId = newSessionId();
  document.getElementById("sessionLabel").textContent = "session: " + sessionId;
  document.getElementById("chatLog").innerHTML = "";
  addBotBubble({
    answer: "Hi! I'm the UPI Help assistant. Pick a question below, or click a suggestion any time.",
    domain: "faq", fast_lane: false, reason: "greeting", trace: []
  });
  renderQuickReplies(DEFAULT_REPLIES);
}

function renderQuickReplies(replies) {
  const wrap = document.getElementById("quickReplies");
  wrap.innerHTML = "";
  replies.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "qr-btn" + (r.candidate ? " candidate" : "");
    btn.textContent = r.label;
    btn.onclick = () => {
      if (r.value === "__upload__") {
        document.getElementById("screenshotInput").click();
      } else {
        sendQuery(r.value);
      }
    };
    wrap.appendChild(btn);
  });
}

function renderMandateCards(candidates) {
  const log = document.getElementById("chatLog");
  const wrap = document.createElement("div");
  wrap.className = "mandate-cards";

  candidates.forEach(c => {
    const card = document.createElement("div");
    card.className = "mandate-card";
    card.innerHTML = `
      <div class="merchant">${c.merchant}</div>
      <div class="amount">₹${c.amount}</div>
      <span class="status">${c.status || "ACTIVE"}</span>
      <div class="select-hint">Tap to select this mandate</div>
    `;
    card.onclick = () => {
      wrap.remove();
      sendQuery(`the one for ${c.amount} rupees`);
    };
    wrap.appendChild(card);
  });

  log.appendChild(wrap);
  scrollDown();
}

function addUserBubble(text) {
  const log = document.getElementById("chatLog");
  const row = document.createElement("div");
  row.className = "row user";
  const bubble = document.createElement("div");
  bubble.className = "bubble user";
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  scrollDown();
}

function addTyping() {
  const log = document.getElementById("chatLog");
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typingIndicator";
  div.textContent = "UPI Help is thinking...";
  log.appendChild(div);
  scrollDown();
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

function addBotBubble(data) {
  const log = document.getElementById("chatLog");
  const row = document.createElement("div");
  row.className = "row bot";

  const bubble = document.createElement("div");
  bubble.className = "bubble bot";
  bubble.textContent = data.answer;
  row.appendChild(bubble);

  const meta = document.createElement("div");
  meta.className = "meta";

  const domainBadge = document.createElement("span");
  domainBadge.className = "badge domain";
  domainBadge.textContent = data.domain;
  meta.appendChild(domainBadge);

  const laneBadge = document.createElement("span");
  if (data.reason === "hook_blocked") {
    laneBadge.className = "badge blocked";
    laneBadge.textContent = "safety check";
  } else if (data.reason === "ambiguous_pause") {
    laneBadge.className = "badge slow";
    laneBadge.textContent = "clarification needed";
  } else if (data.fast_lane) {
    laneBadge.className = "badge fast";
    laneBadge.textContent = "⚡ fast lane";
  } else {
    laneBadge.className = "badge slow";
    laneBadge.textContent = "🔄 full reasoning";
  }
  meta.appendChild(laneBadge);
  row.appendChild(meta);

  if (data.pending_intent_id) {
    const confirmBtn = document.createElement("button");
    confirmBtn.className = "qr-btn candidate";
    confirmBtn.style.marginTop = "8px";
    confirmBtn.textContent = "✓ Confirm this action";
    confirmBtn.onclick = () => confirmIntent(data.pending_intent_id, confirmBtn);
    row.appendChild(confirmBtn);
  }
 if (data.receipt_url) {
  const receiptBtn = document.createElement("a");
  receiptBtn.className = "qr-btn candidate";
  receiptBtn.style.marginTop = "8px";
  receiptBtn.style.display = "inline-block";
  receiptBtn.style.textDecoration = "none";
  receiptBtn.href = data.receipt_url;
  receiptBtn.textContent = "📄 Download receipt";
  row.appendChild(receiptBtn);
  }
  if (data.trace && data.trace.length > 0) {
    const toggle = document.createElement("div");
    toggle.className = "trace-toggle";
    toggle.textContent = "show trace ▾";
    const tracePanel = document.createElement("div");
    tracePanel.className = "trace-panel";
    tracePanel.textContent = JSON.stringify(data.trace, null, 2);
    toggle.onclick = () => {
      tracePanel.classList.toggle("show");
      toggle.textContent = tracePanel.classList.contains("show") ? "hide trace ▴" : "show trace ▾";
    };
    row.appendChild(toggle);
    row.appendChild(tracePanel);
  }

  log.appendChild(row);
  scrollDown();

  if (data.candidates && data.candidates.length > 0) {
    renderMandateCards(data.candidates);
    renderQuickReplies([]);
  } else {
    renderQuickReplies(DEFAULT_REPLIES);
  }
}
function addUserImageBubble(file) {
  const log = document.getElementById("chatLog");
  const row = document.createElement("div");
  row.className = "row user";
  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.style.maxWidth = "220px";
  img.style.borderRadius = "14px";
  img.style.display = "block";
  row.appendChild(img);
  log.appendChild(row);
  scrollDown();
}
function scrollDown() {
  const log = document.getElementById("chatLog");
  log.scrollTop = log.scrollHeight;
}

async function sendQuery(text) {
  addUserBubble(text);
  addTyping();
  renderQuickReplies([]); // hide replies while waiting

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    removeTyping();
    addBotBubble(data);
  } catch (e) {
    removeTyping();
    addBotBubble({ answer: "Something went wrong: " + e, domain: "error", fast_lane: false, reason: "error", trace: [] });
  }
}

async function confirmIntent(intentId, buttonEl) {
  buttonEl.disabled = true;
  buttonEl.textContent = "Confirming...";
  try {
    const res = await fetch("/api/confirm_intent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ intent_id: intentId }),
    });
    const data = await res.json();
    buttonEl.remove();

    if (data.error) {
      addBotBubble({ answer: "Couldn't confirm: " + data.error, domain: "mandate", fast_lane: false, reason: "confirm_error", trace: [] });
    } else {
      const mandate = data.mandate || {};
      addBotBubble({
        answer: `Done — your ${mandate.merchant || "mandate"} is now ${mandate.status}.`,
        domain: "mandate", fast_lane: false, reason: "confirmed", trace: []
      });
    }
  } catch (e) {
    buttonEl.disabled = false;
    buttonEl.textContent = "✓ Confirm this action";
    addBotBubble({ answer: "Something went wrong confirming: " + e, domain: "error", fast_lane: false, reason: "error", trace: [] });
  }
}

async function resetDatabase() {
  const confirmed = confirm("This will wipe all mandate/transaction data back to the original demo state. Continue?");
  if (!confirmed) return;

  try {
    const res = await fetch("/api/reset", { method: "POST" });
    const data = await res.json();
    resetSession();
    addBotBubble({
      answer: "Database reset — all mandates and transactions are back to their original demo state.",
      domain: "faq", fast_lane: false, reason: "db_reset", trace: []
    });
  } catch (e) {
    alert("Reset failed: " + e);
  }
}

async function uploadScreenshot(file) {
  if (!file) return;
  addUserImageBubble(file);
  addTyping();

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/api/upload_screenshot", { method: "POST", body: formData });
    const data = await res.json();
    removeTyping();

    if (data.error) {
      addBotBubble({ answer: data.error, domain: "dispute", fast_lane: false, reason: "ocr_failed", trace: [] });
      return;
    }

    addBotBubble({
      answer: `I have the details from the screenshot you uploaded — ${data.merchant || "your transaction"} ₹${data.amount || ""}, ${data.txn_status || ""} on ${data.date || ""}. I've filed a dispute — reference ${data.dispute_id}. You can download a receipt below.`,
      domain: "dispute", fast_lane: false, reason: "dispute_filed", trace: [],
      receipt_url: data.receipt_url,
    });
  } catch (e) {
    removeTyping();
    addBotBubble({ answer: "Something went wrong reading that screenshot: " + e, domain: "error", fast_lane: false, reason: "error", trace: [] });
  }

  document.getElementById("screenshotInput").value = "";
}


// initial state
addBotBubble({
  answer: "Hi! I'm the UPI Help assistant. Pick a question below, or click a suggestion any time.",
  domain: "faq", fast_lane: false, reason: "greeting", trace: []
});
renderQuickReplies(DEFAULT_REPLIES);
</script>

</body>
</html>
